name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: voidzero-dev/setup-vp@v1
      - run: vp install --frozen-lockfile
      - run: vp check --deny-warnings
      - run: vp test --config vitest.config.ts
      - run: vp run pack:plugin
      - name: Build and capture main diagnostics
        run: vp -C . build
        env:
          VZ_UPLOAD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          VZ_ENDPOINT: https://vz.void.app
