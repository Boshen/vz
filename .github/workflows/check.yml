name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: voidzero-dev/setup-vp@v1
      - run: vp install --frozen-lockfile
      - run: vp check --deny-warnings
      - run: vp test --config vitest.config.ts
      - run: vp run pack:plugin
      - run: vp -C . build
  capture:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: voidzero-dev/setup-vp@v1
      - run: vp install --frozen-lockfile
      - name: Build and capture main diagnostics
        shell: bash
        run: vp -C . build 2>&1 | tee /tmp/vz-build.log
        env:
          VZ_UPLOAD: "true"
          VZ_ENDPOINT: https://vz.void.app
      - name: Report main regressions
        run: node scripts/report-regressions.mjs /tmp/vz-build.log
